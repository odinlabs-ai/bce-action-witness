name: blueprint conformance
on: [pull_request]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: blueprint-conformance/bce@ef5b806dcf58b1100db9ca512c6f7683d3873697
        with:
          engine: local
          repo: .
          comment: "false"
